# Facility requirement matrix. Contact details are placeholders.
schema_version: 1

facility:
  id: cedar-ridge-medical
  name: Cedar Ridge Medical Center
  intake:
    method: email
    email: credentialing@example.org
    attention: Contract Labour Intake
    cover_sheet_required: false

updated: 2026-06-20
source: "Requirement checklist, faxed by facility 2026-06-19, retyped by hand"

requirements:
  - code: cna-certification
    name: CNA certification (state registry)
    category: license
    expires: true
    lead_days: 60
    applies_to:
      disciplines: [CNA]
    accepts: [pdf]

  - code: bls-aha
    name: BLS provider card (AHA)
    category: certification
    expires: true
    lead_days: 30
    accepts: [pdf, jpg]

  - code: tb-screening
    name: TB screening (2-step PPD or IGRA)
    category: health
    expires: true
    lead_days: 0
    accepts: [pdf]

  - code: mmr-titer
    name: MMR titer or proof of immunity
    category: health
    expires: false
    accepts: [pdf]

  - code: dementia-care-training
    name: Dementia care training certificate
    category: training
    expires: false
    applies_to:
      disciplines: [CNA]
    accepts: [pdf]

  - code: hipaa-attestation
    name: HIPAA attestation
    category: training
    expires: false
    accepts: [pdf]

  - code: photo-id
    name: Government photo ID
    category: identity
    expires: false
    accepts: [pdf, jpg, png]
